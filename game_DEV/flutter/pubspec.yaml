name: gamedev
description: Breaking a Block Augment - Flutter + Flame MVP
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.1
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  google_mobile_ads: ^6.0.0
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  package_info_plus: ^8.0.3
  device_info_plus: ^11.1.2
  sentry_flutter: ^9.14.0
  in_app_review: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sentry_dart_plugin: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/audio/
    - assets/ui/
    - assets/icons/
    - assets/patterns/
    - assets/vfx/
    - assets/fonts/
    - assets/data/
    - assets/config/

sentry:
  upload_debug_symbols: false
  upload_source_maps: false
  auth_token: ${SENTRY_AUTH_TOKEN}
  org: ${SENTRY_ORG}
  project: ${SENTRY_PROJECT}
  release: ${SENTRY_RELEASE}
  dist: ${SENTRY_DIST}
