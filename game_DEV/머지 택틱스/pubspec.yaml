name: merge_tactics
description: "Merge Tactics prototype for Android portrait mode"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - Assets/StylizedFantasyUnits/
    - Assets/Mapped/audio/
    - Assets/Mapped/battle_pass/
    - Assets/Mapped/currency/
    - Assets/Mapped/icons/
    - Assets/Mapped/lobby/
    - Assets/Mapped/ui/
    - Assets/Mapped/units/
    - Assets/Mapped/vfx/
  fonts:
    - family: KenneyMiniSquare
      fonts:
        - asset: Assets/Mapped/fonts/KenneyMiniSquare.ttf
    - family: Chogoon
      fonts:
        - asset: Assets/Mapped/fonts/Chogoon.ttf
